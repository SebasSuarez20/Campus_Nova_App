<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-hello">Hola de nuevo 👋</span>
    <span class="topbar-term">Periodo 2026-II · Programa de créditos</span>
  </div>

  <div class="topbar-right">
    <span class="chip-credits" title="Créditos inscritos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 3 2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7L12 3Z" />
      </svg>
      9 créditos
    </span>

    <div class="user">
      <div class="avatar" aria-hidden="true">{{ initials }}</div>
      <div class="user-text">
        <span class="user-name">{{ fullName }}</span>
        <span class="user-rol">{{ rol }}</span>
      </div>
    </div>
  </div>
</header>
